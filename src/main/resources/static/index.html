<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk Engine Console</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec;
          --pass:#1a7f4b; --review:#b26a00; --reject:#c62828; --accent:#2f5bea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f29; --text:#e6e9f0; --muted:#8d95a8; --line:#2b3140;
            --pass:#4cc38a; --review:#f0a43a; --reject:#ff6b6b; --accent:#7b9bff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); background:var(--card);
           display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px;
         grid-template-columns:minmax(0,340px) minmax(0,1fr); }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:14px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
          background:var(--bg); color:var(--text); font:inherit; }
  button { padding:8px 12px; border:1px solid var(--line); border-radius:6px; cursor:pointer;
           background:var(--card); color:var(--text); font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; width:100%; margin-top:14px; }
  button:hover { filter:brightness(.95); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .presets { margin-top:6px; }
  .presets button { font-size:12px; padding:5px 8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600;
         border:1px solid currentColor; }
  .PASS { color:var(--pass); } .REVIEW { color:var(--review); } .REJECT { color:var(--reject); }
  .muted { color:var(--muted); font-size:12px; }
  #msg { margin-top:10px; min-height:18px; font-size:12px; color:var(--muted); }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<header><h1>Risk Engine Console</h1><span>提交交易，实时查看风控决策</span></header>
<main>
  <section class="card">
    <h2>提交交易</h2>
    <label>用户 ID (userId)</label><input id="userId" value="u1">
    <label>设备 ID (deviceId)</label><input id="deviceId" value="d1">
    <label>金额 (amount)</label><input id="amount" type="number" value="100" min="0">
    <label>IP</label><input id="ip" value="1.1.1.1">
    <label>国家 (country)</label><input id="country" value="CN">
    <button class="primary" id="send">提交交易</button>
    <div id="msg"></div>
    <div class="muted" style="margin-top:14px">快捷场景</div>
    <div class="row presets">
      <button data-p="normal">正常小额</button>
      <button data-p="review">金额 6000</button>
      <button data-p="reject">金额 30000</button>
      <button data-p="black">黑名单用户</button>
      <button data-p="velocity">1 分钟连发 15 笔</button>
      <button data-p="device">同设备 5 个账号</button>
    </div>
  </section>
  <section class="card">
    <h2>决策结果 <span class="muted" id="count"></span></h2>
    <div class="scroll"><table>
      <thead><tr><th>时间</th><th>用户</th><th>决策</th><th>命中规则</th><th>耗时</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">暂无数据，先提交一笔交易</td></tr></tbody>
    </table></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const rnd = () => Math.random().toString(36).slice(2, 7);

async function post(tx) {
  const r = await fetch('/api/transactions', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(tx)});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function form() {
  return { userId:$('userId').value.trim(), deviceId:$('deviceId').value.trim(),
           amount:Number($('amount').value), currency:'CNY',
           ip:$('ip').value.trim(), country:$('country').value.trim() };
}
function fill(o) { for (const k in o) $(k).value = o[k]; }
function say(t) { $('msg').textContent = t; }

$('send').onclick = async () => {
  try { const r = await post(form()); say('已发送 ' + r.eventId); load(); }
  catch (e) { say('发送失败：' + e.message); }
};

document.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
  const p = b.dataset.p;
  try {
    if (p === 'normal') fill({userId:'u_'+rnd(), deviceId:'d_'+rnd(), amount:100});
    if (p === 'review') fill({userId:'u_'+rnd(), deviceId:'d_'+rnd(), amount:6000});
    if (p === 'reject') fill({userId:'u_'+rnd(), deviceId:'d_'+rnd(), amount:30000});
    if (p === 'black')  fill({userId:'u_blacklisted', deviceId:'d_'+rnd(), amount:50});
    if (p === 'velocity') {
      const u = 'u_fast_' + rnd(); fill({userId:u, amount:10});
      for (let i = 0; i < 15; i++) await post({...form(), userId:u});
      say('已为 ' + u + ' 连发 15 笔'); setTimeout(load, 800); return;
    }
    if (p === 'device') {
      const d = 'd_shared_' + rnd(); fill({deviceId:d, amount:10});
      for (let i = 0; i < 5; i++) await post({...form(), userId:'u_'+rnd(), deviceId:d});
      say('已用设备 ' + d + ' 发 5 个不同账号'); setTimeout(load, 800); return;
    }
    say('已填入场景，点“提交交易”发送');
  } catch (e) { say('发送失败：' + e.message); }
});

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function load() {
  try {
    const list = await (await fetch('/api/decisions')).json();
    $('count').textContent = list.length ? '(最近 ' + list.length + ' 条)' : '';
    if (!list.length) return;
    $('rows').innerHTML = list.map(d => `<tr>
      <td class="muted">${esc(new Date(d.decidedAt).toLocaleTimeString())}</td>
      <td>${esc(d.userId)}</td>
      <td><span class="tag ${esc(d.decision)}">${esc(d.decision)}</span>${d.shadow ? ' <span class="muted">影子</span>' : ''}</td>
      <td>${(d.hits||[]).map(h => esc(h.ruleId) + ' <span class="muted">' + esc(h.reason) + '</span>').join('<br>') || '<span class="muted">无</span>'}</td>
      <td>${esc(d.latencyMs)} ms</td></tr>`).join('');
  } catch (e) { /* retry on next tick */ }
}
setInterval(load, 1500); load();
</script>
</body>
</html>
